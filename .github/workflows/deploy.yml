name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache shadow-cljs build state
        uses: actions/cache@v4
        with:
          path: .shadow-cljs
          key: ${{ runner.os }}-shadow-cljs-${{ hashFiles('src/**/*.cljs', 'src/**/*.cljc') }}
          restore-keys: |
            ${{ runner.os }}-shadow-cljs-

      - name: Install npm dependencies
        run: npm ci

      - name: Create output directories
        run: mkdir -p dist/play/release/latest

      - name: Bundle CSS
        run: |
          npx esbuild \
            --bundle \
            --minify \
            --loader:.svg=dataurl \
            --outfile=dist/play/release/latest/ogres.app.css \
            src/main/ogres/app/resource/root.css

      - name: Copy static assets
        run: |
          cp web/release/icons.svg dist/play/release/latest/icons.svg
          cp web/index.html dist/play/index.html

      - name: Build ClojureScript
        env:
          OUTPUT_DIR: dist/play/release/latest
          ASSET_PATH: release/latest
        run: |
          clojure -M -m shadow.cljs.devtools.cli release app \
            --config-merge "{:closure-defines {ogres.app.const/VERSION \"latest\" ogres.app.const/PATH \"/play/release/latest\"}}"

      - name: Copy marketing page
        run: cp -r site/web/. dist/

      - name: Copy CNAME
        run: cp CNAME dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
