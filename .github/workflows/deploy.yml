name: Deploy to GitHub Pages
# arbitrary

on:
  push:
    branches:
      #- dev
      - render-backend-deployment
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: echo "OGRES_VERSION=$(tail -1 web/releases.txt)" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache shadow-cljs build state
        uses: actions/cache@v4
        with:
          path: .shadow-cljs
          key: ${{ runner.os }}-shadow-cljs-${{ hashFiles('src/**/*.cljs', 'src/**/*.cljc') }}
          restore-keys: |
            ${{ runner.os }}-shadow-cljs-

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS
        run: |
          mkdir -p web/release/latest
          npx esbuild \
            --bundle \
            --minify \
            --loader:.svg=dataurl \
            --outfile=web/release/latest/ogres.app.css \
            src/main/ogres/app/resource/root.css
          cp web/release/icons.svg web/release/latest/icons.svg

      - name: Build ClojureScript
        env:
          OUTPUT_DIR: web/release/latest
          ASSET_PATH: release/latest
          SERVER_SOCKET_URL: ${{ vars.SERVER_SOCKET_URL || 'ws://localhost:5000/ws' }}
        run: |
          clojure -M -m shadow.cljs.devtools.cli release app \
            --config-merge "{:closure-defines {ogres.app.const/VERSION \"${{ env.OGRES_VERSION }}\" ogres.app.const/PATH \"/play/release/latest\" ogres.app.const/SOCKET-URL \"${SERVER_SOCKET_URL}\"}}"

      - name: Assemble site
        run: |
          mkdir -p _site/play
          cp -r site/web/. _site/
          cp web/index.html _site/play/index.html
          cp -r web/release _site/play/release
          cp web/releases.txt _site/releases.txt
          cp CNAME _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
